name = "AmbidextrousSofa"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["AmbidextrousSofa", "Challenge", "Solution"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0-rc3"

# The formalization of Jineon Baek's theorem (the optimality of Gerver's sofa), copied from
# lean4-moving-sofa (MovingSofaOptimality/README.md). Two steps of the
# proof use its bound 2.2199 for the area of a moving sofa, and some proofs its convex-body library
# (support functions, surface area measures).
[[lean_lib]]
name = "MovingSofaOptimality"
globs = ["MovingSofaOptimality.+"]

# The proof. `AmbidextrousSofa.Main` states its main theorems in the vocabulary of the Challenge,
# whose definitions `AmbidextrousSofa.ChallengeDefs` holds.
[[lean_lib]]
name = "AmbidextrousSofa"
globs = ["AmbidextrousSofa.+"]

# The statements of record, in Mathlib's vocabulary only (comparator.json).
[[lean_lib]]
name = "Challenge"

# Their proofs, under the Challenge's names. No module imports it.
[[lean_lib]]
name = "Solution"
