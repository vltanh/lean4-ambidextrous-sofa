name = "AmbidextrousSofa"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["AmbidextrousSofa", "Challenge", "Solution"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0-rc3"

# The formalization of Jineon Baek's theorem (the optimality of Gerver's sofa), whose upper bound
# 2.2199 for the area of a moving sofa the manuscript cites (MS.18), and whose convex-body library
# (support functions, surface area measures) some proofs use: the library MovingSofaOptimality.
[[require]]
name = "MovingSofa"
git = "https://github.com/vltanh/lean4-moving-sofa"
rev = "1174c5c25c1c66b807e368446d6682e8d0276759"

# The formalization of the manuscript. `AmbidextrousSofa.Main` states its main theorems in the
# vocabulary of the Challenge, whose definitions `AmbidextrousSofa.ChallengeDefs` holds.
[[lean_lib]]
name = "AmbidextrousSofa"
globs = ["AmbidextrousSofa.+"]

# The statements of record, in Mathlib's vocabulary only (comparator.json).
[[lean_lib]]
name = "Challenge"

# Their proofs, under the Challenge's names. No module imports it.
[[lean_lib]]
name = "Solution"
