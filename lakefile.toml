name = "AmbidextrousSofa"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["AmbidextrousSofa"]

[leanOptions]
pp.unicode.fun = true
autoImplicit = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0-rc3"

# Baek's optimality theorem for Gerver's sofa, formalized in Lean (MovingSofaOptimality), which the
# manuscript cites for the ordinary upper bound 22199/10000, and whose convex-body and surface-area
# library some proofs use.
[[require]]
name = "MovingSofa"
git = "https://github.com/vltanh/lean4-moving-sofa"
rev = "1174c5c25c1c66b807e368446d6682e8d0276759"

[[lean_lib]]
name = "AmbidextrousSofa"
globs = ["AmbidextrousSofa.+"]
