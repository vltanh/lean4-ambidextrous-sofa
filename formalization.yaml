        the 849 proofs that failed, by changes of tactics and names; 77 theorems in sections with
        variable hypotheses got back the hypotheses that Lean had left out of their statements.
        One sub-agent reviewed the statements of record against the manuscript and Romik's paper,
        and another mapped the modules to the manuscript. The main session wrote the Challenge, the
        Solution, the axiom audit, the documentation and the figures.
      cost:
        wall_time: >-
          Making the draft compile, with the Challenge and the Solution: 1 hour 41 minutes
          (2026-10-10 15:27 to 17:08, US Central Time), with about 10.0 hours of sub-agent working
          time. The documentation and this metadata: about 35 minutes (2026-10-10 17:08 to 17:43).
          docs/CREDITS.md gives the figures.
        spend_usd: "not tracked"
        hardware: "a local machine with 20 cores for the Lean builds"
    - method: agent
      models: ["ChatGPT Pro 6 (OpenAI)"]
      framework: "ChatGPT (OpenAI), committing to the repository through GitHub"
      tool_setup: >-
        Wrote the research notes and the manuscript in pull request #3 of lean4-moving-sofa (8 to 10
