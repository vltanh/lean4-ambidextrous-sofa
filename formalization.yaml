      tool_setup: >-
        Claude Code 2.1.296, following the formalize-math-paper skill
        (https://github.com/vltanh/formalize-math-paper, its version of 7 October 2026) for an
        existing uncompiled draft. In a first session, with 44 sub-agents of the same model, at most
