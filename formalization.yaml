# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

# The Challenge is Challenge.lean, the Solution Solution.lean, and the Comparator configuration
# comparator.json.

project:
  name: "Optimality and uniqueness of Romik's ambidextrous sofa, formalized in Lean 4"
  # The description is shown as plain text that keeps line breaks. Its paragraphs are separated by
  # two empty lines, which this folded block turns into one empty line.
  description: >-
    The ambidextrous moving sofa problem asks for the largest area of a connected planar shape that
    can be moved, from one starting position, around the right-angled corner of a hallway of unit
    width that turns right, and also around the corner of a hallway that turns left. Dan Romik
    (Experimental Mathematics, 2018) constructed a shape of area
    M = 1 + 4Y^2 + arctan Y = 1.64495..., where Y = 0.2980... is the positive root of
    4Y^3 + 3Y = 1, and proposed it as a likely solution.


    This entry proves that Romik's ambidextrous sofa is optimal and that it is the only optimal
    shape. Every compact connected set that continuous rigid motions, starting in the same
    orientation, move through both hallways has area at most M, with equality if and only if the set
    is the image of Romik's sofa by a rotation and a translation. It also proves that Romik's sofa
    and its images by rotations and translations move through both hallways, that its area is M,
    that its convex hull is the convex body given by its support function, and that M is Romik's
    closed form (3 + 2 sqrt 2)^(1/3) + (3 - 2 sqrt 2)^(1/3) - 1
    + arctan(((sqrt 2 + 1)^(1/3) - (sqrt 2 - 1)^(1/3))/2).


    The proof formalizes the manuscript "Sharp area and exact uniqueness for the ambidextrous moving
    sofa problem", which has not been peer reviewed. Two of its steps use Jineon Baek's theorem that
    Gerver's sofa is optimal for the ordinary moving sofa problem (arXiv:2411.19826), which the Lean
    formalization lean4-moving-sofa proves; this repository depends on it.
  authors:
    - "The-Anh Vu-Le"
  license: "Apache-2.0"
  responsible_maintainers:
    - "The-Anh Vu-Le"

classification:
  arxiv: ["math.MG", "math.OC"]
  msc2020: ["49Q10", "52A10", "52A38", "52A40", "68V20"]

