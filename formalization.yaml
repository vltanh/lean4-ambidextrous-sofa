    type: "manuscript"
    location: "https://github.com/vltanh/lean4-ambidextrous-sofa/blob/a0595b1316d0192d5315c03484a255be323a8194/docs/archive/GATE3-MANUSCRIPT.md"
    relationship: formalizes
    note: >-
      Written by ChatGPT Pro 6 (OpenAI) at the request of The-Anh Vu-Le, in research sessions from
