      has checked it. The Lean proofs are ChatGPT Pro 6's Lean draft of its argument, repaired; the
      draft reaches several of its intermediate results by other arguments (fidelity.divergences).
    author_endorsement: n/a
  - title: "Differential Equations and Exact Solutions in the Moving Sofa Problem"
    authors:
      - "Dan Romik"
    id: "doi:10.1080/10586458.2016.1270858"
    type: paper
    location: "Experimental Mathematics 27 (2018), no. 3, 316-330; arXiv:1606.08111"
    relationship: background
    note: >-
      Constructs the ambidextrous sofa, the set S_x intersected with its reflection in the line
      y = 1/2 (Section 5 and Theorem 5), gives its area in closed form (Equation (5) and Theorem 5),
      and calls it a highly plausible candidate for the solution of the ambidextrous problem. The Challenge defines the sofa from the
      manuscript's formulas for its support function, which are Romik's, and
      Ambidextrous.value_eq_romik proves that M equals his closed form. The manuscript proves the
      properties of the sofa that it uses.
    author_endorsement: not-contacted
  - title: "Optimality of Gerver's Sofa"
    authors:
      - "Jineon Baek"
    id: "arXiv:2411.19826v1"
    type: paper
    location: "https://arxiv.org/abs/2411.19826v1"
    relationship: background
    note: >-
      The manuscript's one external input (MS.18): every moving sofa of the ordinary problem has
      area at most 22199/10000, from Baek's Theorem 1.1.1 and a bound on the area of Gerver's sofa.
      It is not assumed: the proof uses MovingSofaOptimality.gm_area_le and
      MovingSofaOptimality.gerverSofa_area_mem, proved in lean4-moving-sofa.
    author_endorsement: not-contacted
  - title: "Mathematical exploration and discovery at scale"
    authors:
      - "Bogdan Georgiev"
      - "Javier Gómez-Serrano"
      - "Terence Tao"
      - "Adam Zsolt Wagner"
    id: "arXiv:2511.02864v3"
    type: paper
    location: "https://arxiv.org/abs/2511.02864v3"
    relationship: background
    note: >-
      Lists the ambidextrous sofa problem as open (Problem 6.63, "Ambidextrous sofa (Conway's
      car)"): Romik's sofa gives the lower bound 1.6449..., and whether it is sharp remains open.
      Context only.
    author_endorsement: n/a
  - title: "Problem 66-11, Moving Furniture Through a Hallway"
    authors:
      - "Leo Moser"
    type: paper
    location: "SIAM Review 8 (1966), no. 3, 381"
    relationship: background
    note: "The origin of the moving sofa problem; context only."
    author_endorsement: n/a

related_formalizations:
  - id: "https://github.com/vltanh/lean4-moving-sofa"
    relationship: builds-on
    note: >-
      The formalization of Baek's optimality theorem for the ordinary problem, by the same
      maintainer, registered in Palomar as PALOMAR-2026-10-02-000008. The Solution depends on it, at
      commit 1174c5c25c1c66b807e368446d6682e8d0276759, for Baek's theorem and the area of Gerver's
      sofa; the Challenge does not import it. No earlier formalization of the ambidextrous problem is
      known: the other Lean formalizations of the moving sofa problem (deancureton/MovingSofa,
      RuifengCao/sofa-formal, and Google DeepMind's formal-conjectures) treat the ordinary problem.

status:
  scope: >-
    Formalized: the main theorem of the manuscript (MS.3, Theorem G3C2), that
    every ambidextrous sofa has area at most M = 1 + 4Y^2 + arctan Y and has area M if and only if
    it is the image of Romik's sofa by a rotation and a translation; that Romik's sofa and its images
    by rotations and translations are ambidextrous sofas, of area M (MS.15); that its convex hull is
    the convex body given by its support function (MS.14); that 4Y^3 + 3Y = 1 has exactly one
    positive root; and that M is Romik's closed form. The formalization is unconditional: the proof
    uses Baek's theorem and a bound on the area of Gerver's sofa (MS.18), which lean4-moving-sofa
    proves. Not stated as a theorem of
    record: that both motions of a sofa of area M turn it through exactly a quarter turn, which the
    proof of uniqueness establishes. Some intermediate results of the manuscript are not
    formalized, because the Lean proof reaches the next step by another argument
    (fidelity.divergences, and docs/layout.md, Section 2).
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

