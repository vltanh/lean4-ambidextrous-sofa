sources:
  - title: "Optimality and uniqueness of Romik's ambidextrous sofa"
    type: original-proof
    relationship: other
    note: >-
      ChatGPT Pro 6 (OpenAI) found the proof and wrote an uncompiled Lean draft of it, and Claude
      Opus 5.5 (Anthropic) made the draft compile and simplified it. The research notes behind it end
      with a manuscript, archived in docs/archive/. Codex (OpenAI, GPT-6) wrote the 109-page proof
      manuscript in docs/paper/ and revised it together with the Lean proofs. No person has reviewed
      the proof. docs/CREDITS.md tells how the work was done.
  - title: "Differential Equations and Exact Solutions in the Moving Sofa Problem"
    authors:
      - "Dan Romik"
    id: "doi:10.1080/10586458.2016.1270858"
    type: paper
    location: "Experimental Mathematics 27 (2018), no. 3, 316-330; arXiv:1606.08111"
    relationship: background
    note: >-
      Constructs the ambidextrous sofa, the set S_x intersected with its reflection in the line
      y = 1/2 (Section 5 and Theorem 5), gives its area in closed form (Equation (5) and Theorem 5),
      and calls it a highly plausible candidate for the solution of the ambidextrous problem. The
      Challenge defines his sofa from the support function of its convex hull, and value_eq_romik
      proves that its area is his closed form. The properties of the sofa that the proof uses are
      proved in the repository.
    author_endorsement: not-contacted
  - title: "Optimality of Gerver's Sofa"
    authors:
      - "Jineon Baek"
    id: "arXiv:2411.19826v1"
    type: paper
    location: "https://arxiv.org/abs/2411.19826v1"
    relationship: background
    note: >-
      Two steps of the proof use that every moving sofa of the ordinary problem has area at most
      22199/10000, from Baek's Theorem 1.1.1 and a bound on the area of Gerver's sofa. Neither is
      assumed: MovingSofaOptimality.gm_area_le and MovingSofaOptimality.gerverSofa_area_mem are
      proved in the copy of lean4-moving-sofa's library MovingSofaOptimality that the repository
      includes.
    author_endorsement: not-contacted
  - title: "Mathematical exploration and discovery at scale"
    authors:
      - "Bogdan Georgiev"
      - "Javier Gómez-Serrano"
      - "Terence Tao"
      - "Adam Zsolt Wagner"
    id: "arXiv:2511.02864v3"
    type: paper
    location: "https://arxiv.org/abs/2511.02864v3"
    relationship: background
    note: >-
      Lists the ambidextrous sofa problem as open (Problem 6.63, "Ambidextrous sofa (Conway's
      car)"): Romik's sofa gives the lower bound 1.6449..., and whether it is sharp remains open.
      Context only.
    author_endorsement: n/a
  - title: "Problem 66-11, Moving Furniture Through a Hallway"
    authors:
      - "Leo Moser"
    type: paper
    location: "SIAM Review 8 (1966), no. 3, 381"
    relationship: background
    note: "The origin of the moving sofa problem; context only."
    author_endorsement: n/a

related_formalizations:
  - id: "https://github.com/vltanh/lean4-moving-sofa"
    relationship: builds-on
    note: >-
      The formalization of Baek's optimality theorem for the ordinary problem, by the same
      maintainer, registered in Palomar as PALOMAR-2026-10-02-000008. Its library
      MovingSofaOptimality, at commit 1174c5c25c1c66b807e368446d6682e8d0276759, is copied unchanged
      into this repository, for Baek's theorem and the area of Gerver's sofa; the Challenge does not
      use it. Dean Cureton's MovingSofa and Ruifeng Cao's sofa-formal also formalize the ordinary
      problem; docs/prior-work.md compares them. The earlier formal statement of the ambidextrous
      conjecture is listed separately below.
  - id: "https://github.com/google-deepmind/formal-conjectures/pull/6424"
    relationship: independent
    note: >-
      An earlier Lean formalization of the ambidextrous sofa conjecture, proposed by frvnkliu
      on 19 September 2026 in FormalConjectures/Wikipedia/MovingSofa.lean. At commit
      b5289b1114c76b2c8a99407580d0ebb3adbb9ea4, it defines ambidextrous sofas, their area supremum
      and Romik's exact area, and states ambidextrousSofaConstant_eq_romiksSofa_area as an open
      conjecture with a sorry proof. The lower-bound statement also has a sorry proof; supporting
      facts, including the unit-square example, cubic-root uniqueness and the comparison with
      the ordinary sofa constant, are proved. This is an earlier formal statement and partial
      development, not a proof of global optimality or uniqueness. The present repository
      supplies proofs of optimality and uniqueness and constructs the maximizing shape. The
      earlier statement was consulted for the prior-work comparison in docs/prior-work.md;
      its declarations are not imported by this project. The source is pinned at
      https://github.com/frvnkliu/formal-conjectures/blob/b5289b1114c76b2c8a99407580d0ebb3adbb9ea4/FormalConjectures/Wikipedia/MovingSofa.lean.

status:
  scope: >-
    Formalized: the optimality of Romik's ambidextrous sofa, that every ambidextrous sofa has area
    at most M = 1 + 4Y^2 + arctan Y, and its uniqueness, that an ambidextrous sofa has area M if and
    only if it is the image of Romik's sofa by a rotation and a translation; that each of the two
    motions of an ambidextrous sofa of area M turns it through a full quarter turn at some time;
    that Romik's sofa and its images by rotations and translations are ambidextrous sofas, of area
    M; that its convex hull is the convex body given by its support function; that 4Y^3 + 3Y = 1
    has exactly one positive root; and that M is Romik's closed form. The formalization is
    unconditional: two steps use Baek's theorem and a bound on the area of Gerver's sofa, proved in
    the copy of lean4-moving-sofa's library that the repository includes.
  sorry_count: 0
  sorry_in_definitions: 0
  axioms: []

