fidelity:
  divergences: >-
    (1) The problem, which Romik and Georgiev, Gómez-Serrano, Tao and Wagner state informally: the
    plane is R x R, and area is Lebesgue measure. A passage through a hallway is a continuous angle
    theta(t) and a continuous translation c(t) for t in [0, 1], placing each point p of the body at
    rotate(theta(t)) p + c(t), with the body in the incoming arm at t = 0, in the hallway
    throughout, and in the outgoing arm at t = 1; it may pause, turn back and turn through any
    angle. A continuous angle and a continuous translation describe exactly the continuous paths of
    proper rigid motions. An ambidextrous sofa is a compact connected set with a passage through
    each hallway, the two starting with the same orientation, rotate(theta_1(0)) =
    rotate(theta_2(0)); their translations are independent. The hallway that turns left is the
    reflection of the one that turns right in the line y = 1/2. Without the common orientation,
    Gerver's sofa, which is symmetric under a reflection in a vertical line, would pass the hallway
    that turns left after a half turn, and the problem would be the ordinary one.
    (2) Romik's sofa is defined from the support function of its convex hull, in three trigonometric
    phases on each quarter of the circle, with the two niches, the regions swept by the inner
    corners of the two hallways, written as a supremum over the angles of the turn. It is Romik's
    set of his Theorem 5, in his coordinates: an independent review checked that the formulas are
    his, and that the definitions reproduce his Table 2. The root Y is a parameter of the theorems,
    with its defining property; existsUnique_root proves that it is unique.
    (3) Uniqueness is stated up to a rotation about the origin followed by a translation. Romik's
    sofa is symmetric in the line y = 1/2, so its reflections are also rotated and translated
    copies, and this is uniqueness up to congruence.
review:
  status: "agent-reviewed"
  reviewers:
    - "Challenge: a Claude Opus 5.5 sub-agent, separate from the writing agents, compared every definition and theorem of the Challenge with the informal statement of the problem and with Romik's paper"
    - "Accompanying proof manuscript: three Codex (OpenAI, GPT-6) writers reviewed sections written by one another; this was a cross-review among manuscript contributors, separate from the Challenge review"
  notes: >-
    No person has reviewed the proofs, the statements or the definitions. The Challenge review found
    no error; it checked that the definitions of Romik's sofa reproduce his Table 2, and that the
    hypotheses can be met (the unit square with constant motions is an ambidextrous sofa). Its
    corrections of the documentation, and two more theorems (the convex hull of Romik's sofa, and its
    rotated and translated copies), were made. The manuscript review found no unresolved
    mathematical error and clarified two points; docs/paper/REVIEW.md records it. Lean's kernel
    checks the formal proofs, and Comparator checks that the Solution proves the Challenge's
    statements with the standard axioms only, under Lean's kernel and an independent one.

alignment:
  namespace: "Ambidextrous"
  statements:
    - source: "Optimality of Romik's ambidextrous sofa (the main result)"
      lean: "Ambidextrous.volume_le"
      module: "Challenge"
      status: "proved"
      note: >-
        Every ambidextrous sofa (a compact connected subset of R x R that two continuous rigid
        motions, starting in the same orientation, move through the hallway that turns right and
        through the hallway that turns left) has area at most M = 1 + 4Y^2 + arctan Y.
    - source: "Uniqueness of the optimal ambidextrous sofa (the main result)"
      lean: "Ambidextrous.volume_eq_iff"
      module: "Challenge"
      status: "proved"
      note: >-
        An ambidextrous sofa has area M if and only if it is the image of Romik's sofa by a rotation
        about the origin followed by a translation. With volume_le and isAmbidextrous_referenceSofa,
        Romik's sofa is, up to rotations and translations, the only ambidextrous sofa of largest
        area.
    - source: "Both motions of an optimal sofa make a quarter turn (part of the equality case)"
      lean: "Ambidextrous.quarter_turns"
      module: "Challenge"
      status: "proved"
      note: >-
        In an ambidextrous sofa of area M, each of the two motions that witness it turns the body
        through a full quarter turn at some time: clockwise in the hallway that turns right,
        counterclockwise in the one that turns left. The hypotheses are those of IsAmbidextrous with
        the two motions made explicit, so this holds for every pair of motions that witness the
        sofa.
    - source: "Romik's sofa is an ambidextrous sofa (Romik 2018, Section 5)"
      lean: "Ambidextrous.isAmbidextrous_referenceSofa"
      module: "Challenge"
      status: "proved"
      note: "Romik's sofa moves through both hallways, so the bound M is attained."
    - source: "The area of Romik's sofa (Romik 2018, Theorem 5)"
      lean: "Ambidextrous.volume_referenceSofa"
      module: "Challenge"
      status: "proved"
      note: "Romik's sofa has area M = 1 + 4Y^2 + arctan Y."
    - source: "Rotated and translated copies of Romik's sofa (the converse direction of uniqueness)"
      lean: "Ambidextrous.isAmbidextrous_image_referenceSofa"
      module: "Challenge"
      status: "proved"
      note: >-
        Every image of Romik's sofa by a rotation about the origin followed by a translation is an
        ambidextrous sofa.
    - source: "The convex hull of Romik's sofa"
      lean: "Ambidextrous.convexHull_referenceSofa"
      module: "Challenge"
      status: "proved"
      note: >-
        The convex hull of Romik's sofa is the convex body referenceHull Y, the intersection of the
        half-planes given by its support function. This identifies the hull from which the
        Challenge defines the sofa.
    - source: "The root Y of 4Y^3 + 3Y = 1 (Romik 2018, the abstract)"
      lean: "Ambidextrous.existsUnique_root"
      module: "Challenge"
      status: "proved"
      note: >-
        The equation 4Y^3 + 3Y = 1 has exactly one positive solution, so the theorems, which take Y
        with this property, describe one sofa and one number.
    - source: "Romik (2018), Equation (5) and Theorem 5 (the area of his ambidextrous sofa)"
      lean: "Ambidextrous.value_eq_romik"
      module: "Challenge"
      status: "proved"
      note: >-
        M = 1 + 4Y^2 + arctan Y equals Romik's closed form (3 + 2 sqrt 2)^(1/3) + (3 - 2 sqrt 2)^(1/3)
        - 1 + arctan(((sqrt 2 + 1)^(1/3) - (sqrt 2 - 1)^(1/3))/2) = 1.64495..., which identifies the
        Challenge's number with Romik's.

acknowledgements: >-
  Mathlib and the Lean toolchain (Lean 4, Lake, Comparator); lean4-moving-sofa, for the
