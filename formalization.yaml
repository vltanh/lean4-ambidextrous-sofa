  spend_usd: "not tracked"
  notes: >-
    The mathematics and the first Lean code were written by ChatGPT Pro 6; Claude Opus 5.5 made the
    code compile, at the request of The-Anh Vu-Le, the author and maintainer of this repository,
    who chose the problem and the scope and decided the publication. Every result is compiled.
    scripts/Audit.lean checks that each of the 7,474 declarations of the library uses only propext,
    Classical.choice and Quot.sound, and lake comparator checks this Challenge/Solution pair with
    comparator.json.

fidelity:
  divergences: >-
    (1) Readings of the manuscript's definitions: the plane is R x R, and area is Lebesgue measure;
    a passage, the manuscript's continuous path of proper rigid motions, is a continuous angle
    theta(t) and a continuous translation c(t) for t in [0, 1], placing each point p of the body at
    rotate(theta(t)) p + c(t), with the body in the incoming arm at t = 0, in the hallway
    throughout, and in the outgoing arm at t = 1; the two passages start with the same orientation,
    rotate(theta_1(0)) = rotate(theta_2(0)), and their translations are independent. As in the
    manuscript, a passage may pause, turn back and turn through any angle. The second hallway is the
    reflection of the first in the line y = 1/2.
    (2) Romik's sofa is defined in the Challenge from the manuscript's formulas (MS.11) for the
    support function of its convex hull, in three trigonometric phases on each quarter of the
    circle, with the two niches, the regions swept by the inner corners of the two hallways, written
    as a supremum over the angles of the turn. The set is placed as in MS.11 and in Romik's paper,
    with its right end at x = 1; the manuscript's Chapter 5 uses its centered translate, and every
    theorem of record is invariant under translation. The root Y
    is a parameter of the theorems, with its defining property; existsUnique_root proves that it is
    unique. value_eq_romik is Romik's Equation (5), not a claim of the manuscript.
    (3) The manuscript's "congruent to Sigma_*" is stated as "the image of Romik's sofa by a rotation
    about the origin followed by a translation". The two agree, because Romik's sofa is symmetric
    in the line y = 1/2, so that its reflections are also rotated and translated copies.
    (4) The manuscript also says that both motions of an equality body turn it through a quarter
    turn; the proof of uniqueness proves it, but the Challenge does not state it.
    (5) The proofs: the Lean proofs are ChatGPT Pro 6's Lean draft of the manuscript's argument,
    repaired by changes of tactics and names, with no change of argument; 77 theorems got back
    hypotheses that Lean had dropped from their statements. The draft follows the manuscript's
    structure (the reduction of a body to two caps, the bound on the score of a cap, the equality
    case), but reaches several of its intermediate results by other arguments, listed in
    docs/layout.md, Section 2: the body is never boxed by the width-five calculation (GA.9-GA.11),
    since compactness comes at the level of caps; the auxiliary envelopes are not made connected
    (GA.12-GA.15), since the signed-fiber bound is applied to the body itself; the adaptive
    functional of Technical proof 4 replaces the switching functionals of Technical proof 3; an
    explicit family of stationary solutions with fixed-trace uniqueness replaces the Hamiltonian
    period bound and the existence of an H^1 maximizer at fixed width (Technical proof 4); the
    horizontal width exclusions of Technical proof 18 come from the width bounds of Technical proof
    19, which hold for horizontal caps too; and other steps of Technical proofs 16, 19, 21, 33, 39,
    40 and 46 are replaced, or found unnecessary, as that section says. The manuscript has not been compared with the Lean proofs line by line, so this
    list may be incomplete; that audit is future work.
review:
  status: "agent-reviewed"
  reviewers:
    - "A Claude Opus 5.5 sub-agent, separate from the writing agents: a comparison of every definition and theorem of the Challenge with the manuscript and with Romik's paper"
    - "A Claude Opus 5.5 sub-agent: a map of the 466 modules of the library to the sections of the manuscript (docs/layout.md)"
  notes: >-
    No person has reviewed the proofs, the statements, the definitions or the manuscript. The
    review of the Challenge found no error, checked that Romik's Table 2 is reproduced by the
    definitions of his sofa, and that the hypotheses are satisfiable (the unit square with constant
    motions is an ambidextrous sofa); its corrections of the documentation, and two more theorems
    (the convex hull of Romik's sofa and its rotated and translated copies), were made. Lean's
    kernel checks the proofs, and Comparator checks that the Solution proves the Challenge's
    statements with the standard axioms only, under Lean's kernel and an independent one.

alignment:
  namespace: "Ambidextrous"
  statements:
    - source: "MS.3 of the manuscript (Theorem G3C2, G3C.3), the bound"
      lean: "Ambidextrous.volume_le"
      module: "Challenge"
      status: "proved"
      note: >-
        Every ambidextrous sofa (a compact connected subset of R x R that two continuous rigid
        motions, starting in the same orientation, move through the hallway that turns right and
        through the hallway that turns left) has area at most M = 1 + 4Y^2 + arctan Y.
    - source: "MS.3 of the manuscript (Theorem G3C2, G3C.3), the equality case"
      lean: "Ambidextrous.volume_eq_iff"
      module: "Challenge"
      status: "proved"
      note: >-
        An ambidextrous sofa has area M if and only if it is the image of Romik's sofa by a rotation
        about the origin followed by a translation. With volume_le and isAmbidextrous_referenceSofa,
        Romik's sofa is, up to rotations and translations, the only ambidextrous sofa of largest
        area.
    - source: "Chapter 1, Section 3 of the manuscript (the motions of the reference body); Romik, Theorem 5"
      lean: "Ambidextrous.isAmbidextrous_referenceSofa"
      module: "Challenge"
      status: "proved"
      note: "Romik's sofa is an ambidextrous sofa, so the bound M is attained."
    - source: "MS.15 of the manuscript"
      lean: "Ambidextrous.volume_referenceSofa"
      module: "Challenge"
      status: "proved"
      note: "Romik's sofa has area M = 1 + 4Y^2 + arctan Y."
    - source: "MS.3 of the manuscript, the converse direction of the equality case"
      lean: "Ambidextrous.isAmbidextrous_image_referenceSofa"
      module: "Challenge"
      status: "proved"
      note: >-
        Every image of Romik's sofa by a rotation about the origin followed by a translation is an
        ambidextrous sofa.
    - source: "MS.14 of the manuscript"
      lean: "Ambidextrous.convexHull_referenceSofa"
      module: "Challenge"
      status: "proved"
      note: >-
        The convex hull of Romik's sofa is the convex body referenceHull Y, the intersection of the
        half-planes given by the support function of MS.11. This identifies the hull from which
        the Challenge defines the sofa.
    - source: "MS.1 and MS.2 of the manuscript (the root Y)"
      lean: "Ambidextrous.existsUnique_root"
      module: "Challenge"
      status: "proved"
      note: >-
        The equation 4Y^3 + 3Y = 1 has exactly one positive solution, so the theorems, which take Y
        with this property, describe one sofa and one number.
    - source: "Romik (2018), Equation (5) and Theorem 5 (the area of his ambidextrous sofa)"
      lean: "Ambidextrous.value_eq_romik"
      module: "Challenge"
      status: "proved"
      note: >-
        M = 1 + 4Y^2 + arctan Y equals Romik's closed form (3 + 2 sqrt 2)^(1/3) + (3 - 2 sqrt 2)^(1/3)
        - 1 + arctan(((sqrt 2 + 1)^(1/3) - (sqrt 2 - 1)^(1/3))/2) = 1.64495..., which identifies the
        Challenge's number with Romik's.

acknowledgements: >-
  Mathlib and the Lean toolchain (Lean 4, Lake, Comparator); lean4-moving-sofa, for Baek's theorem.
