name: Lean Action CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read # Read access to repository contents

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      # The build needs about 12 GB, close to what the runner has free: remove preinstalled
      # toolchains that the build does not use.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@v7
      - uses: leanprover/lean-action@v1
      # The audit sees a module's proofs only through its own `import all` line.
      - name: Check that the audit imports every module of the library
        run: >-
          diff <(find AmbidextrousSofa MovingSofaOptimality -name '*.lean' | sed 's/\.lean$//; s#/#.#g' | sort)
          <(grep -E '^import all (AmbidextrousSofa|MovingSofaOptimality)' scripts/Audit.lean | sed 's/^import all //' | sort)
      - name: Audit axioms and dependencies
        run: lake env lean scripts/Audit.lean
      - name: Check that the Challenge's copy of the shared definitions is current
        run: python3 scripts/sync_challenge_defs.py --check
      - name: Check the Markdown tables
        run: python3 scripts/check_md_tables.py README.md docs/*.md docs/archive/README.md
